<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="16" viewBox="0 0 1280 16" role="presentation">
<style>
.sw{animation:sw 1.1s cubic-bezier(.2,.9,.2,1) both}
@keyframes sw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.glint{animation:glint 5s ease-in-out infinite}
@keyframes glint{0%,100%{transform:translateX(-200px);opacity:0}45%{opacity:.85}55%{opacity:.85}100%{transform:translateX(1480px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<g class="sw" style="transform-origin:0 50%">
  <rect x="0" y="6" width="426" height="4" fill="#002654"/>
  <rect x="426" y="6" width="428" height="4" fill="#F5F5F5" opacity=".85"/>
  <rect x="854" y="6" width="426" height="4" fill="#CE1126"/>
</g>
<g class="glint"><rect x="0" y="4" width="150" height="8" fill="url(#gl)"/></g>
</svg>